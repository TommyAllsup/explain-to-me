name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Test (Linux)
        if: runner.os != 'Windows'
        run: pnpm test
      # Each test file can launch PowerShell for reparse-point/ACL checks.
      # Bound parallel files to avoid starving those checks on hosted Windows.
      - name: Test (Windows, bounded process concurrency)
        if: runner.os == 'Windows'
        run: pnpm exec tsx --test --test-concurrency=2 packages/*/src/*.test.ts apps/*/src/*.test.ts
      - run: pnpm test:agent
